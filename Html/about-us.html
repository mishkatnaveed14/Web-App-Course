<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <h1>Student Registration</h1>

  <form action="/register" method="post" >

    <fieldset>
      <legend>Zati maloomat</legend>

      <label for="fullname">Poora naam:</label>
      <input type="text" id="fullname" name="fullname" required><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="mob">Mobile:</label>
      <input type="tel" id="mob" name="mob"
             pattern="[0-9]{11}" title="11 digits likhein" required><br><br>

      <label for="pw">Password:</label>
      <input type="password" id="pw" name="pw" minlength="8" required><br><br>

      <label for="dob">Tareekh-e-paidaish:</label>
      <input type="date" id="dob" name="dob">
    </fieldset>

    <fieldset>
      <legend>Jins</legend>
      <input type="radio" id="m" name="gender" value="male" required>
      <label for="m">Male</label>
      <input type="radio" id="f" name="gender" value="female">
      <label for="f">Female</label>
    </fieldset>

    <fieldset>
      <legend>Taaleem</legend>

      <label for="course">Course:</label>
      <select id="course" name="course" required>
        <option value="">-- Chunein --</option>
        <option value="web">Web Development</option>
        <option value="py">Python</option>
        <option>Database</option>
      </select><br><br>

      <p>Aap kya seekh chuke hain?</p>
      <input type="checkbox" id="html" name="skills" >
      <label for="html">HTML</label>
      <input type="checkbox" id="css" name="skills" value="css">
      <label for="css">CSS</label>
      <input type="checkbox" id="js" name="skills" value="js">
      <label for="js">JavaScript</label>
    </fieldset>

    <fieldset>
      <legend>Mazeed</legend>

      <label for="photo">Tasweer:</label>
      <input type="file" id="photo" name="photo" accept="image/*"><br><br>

      <label for="about">Apne baare mein:</label><br>
      <textarea id="about" name="about" rows="4" cols="40"></textarea><br><br>

      <input type="checkbox" id="agree" name="agree" required>
      <label for="agree">Main sharait se muttafiq hoon</label>
    </fieldset>

    <br>
    <button type="submit">Register karein</button>
    <button type="reset">Saaf karein</button>

  </form>
</body>
</html>
