<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class - 09 (Form)</title>
    <!-- <link rel="stylesheet" href="./style.css"> -->
</head>

<body style="background-color: rgb(228, 62, 62); color: white;">
    <h1>Student registration form </h1>
    <form action="#">
        <fieldset>
            <legend>Student Info: </legend>
            <label for="roll no">Roll No :</label>
            <input type="number" placeholder="roll no/12345"><br><br>

            <label for="name"> Student Name: </label>
            <input type="text" placeholder="first name "> .
            <input type="text" placeholder="last name"><br><br>

            <label for="name">Father Name: </label>
            <input type="text" placeholder="Father name "><br><br>

            <label for="Dob"> DOB :</label>
            <input type="date"> <span>MM-DD-YYYY</span> <br><br>

            <label for="M-number">Mobile No.</label>
            <input type="tel" placeholder="030012345"><br><br>
        </fieldset>

        <fieldset>
            <!-- <legend>Email/pswd</legend> -->
            <label for="email">Email id: </label>
            <input type="email"><br><br>

            <label for="pswd">Password: </label>
            <input type="password"><br><br>
        </fieldset>

      <fieldset>
        <legend>Gender:</legend>
          <!-- radio buttons  -->
        <label for="gender">Gender :</label>
        <input type="radio" name="gender" id="male">
        <label for="male">Hefemale</label>
        <input type="radio" name="gender" id="f">
        <label for="f">SheMale</label><br><br>

        <!-- check box -->
        <label for="gender">Gender : </label>
        <input type="checkbox" name="gender" id="male">
        <label for="male">Hefemale</label>
        <input type="checkbox" name="gender" id="f">
        <label for="f">SheMale</label><br><br>
      </fieldset>
        <!-- drop down -->
        <label for="Course">Course: </label>
        <select name="course">
            <option disabled hidden selected>---- Select Current Course ----</option>
            <option value="web">web and app development</option>
            <option value="Graphiics">Graphic designer</option>
            <option value="Graphiics">Graphic designer</option>
            <option value="Graphiics">Graphic designer</option>
        </select><br><br>

        <label for="Student-photo">Student photo : </label>
        <input type="file"><br><br>

        <label for="city">City: </label>
        <select>
            <option disabled hidden selected>----- choose city --------</option>
            <option value="Karachi">Karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Peshawar">Peshawar</option>
            <option value="Multan">Multan</option>
            <option value="Islamabad">Islamabad</option>

        </select><br><br>
        <label for="address">Address: </label>
        <textarea name="address" rows="10" cols="50"></textarea><br><br><br>
        <!-- <textarea name="address" rows="100" cols="50" ></textarea>
        <textarea name="address" rows="100" cols="50" ></textarea> -->

        <!-- <input type="button" value="Submit">  -->
        <button type="reset"> Submit </button>

    </form>

</body>

</html>
